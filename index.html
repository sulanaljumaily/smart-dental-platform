    window.addEventListener('error', function (event) {
      console.error('[DentalPlatform Error]', event.error || event.message);
      if (document.getElementById('root') && !document.getElementById('root').hasChildNodes()) {
        var box = document.getElementById('startup-error-dialog');
        if (!box) {
          box = document.createElement('div');
          box.id = 'startup-error-dialog';
          box.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:#051326;color:#e2e8f0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;font-family:sans-serif;z-index:9999999;text-align:center;direction:rtl;';

            '<div style="font-size:48px;margin-bottom:16px;">⚠️</div>' +
            '<h2 style="margin:0 0 12px;font-size:20px;color:#fff;">تنبيه بدء التشغيل</h2>' +

            '</div>';
          document.body ? document.body.appendChild(box) : document.addEventListener('DOMContentLoaded', function () { document.body.appendChild(box); });

    });
