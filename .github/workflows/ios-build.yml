name: iOS IPA Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-ios:
    runs-on: macos-14

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: |
          pnpm install --no-frozen-lockfile

      - name: Build Web Application
        run: pnpm run build:pro
        env:
          VITE_SUPABASE_URL: https://nhueyaeyutfmadbgghfe.supabase.co
          VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5odWV5YWV5dXRmbWFkYmdnaGZlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njg4MzcwNTYsImV4cCI6MjA4NDQxMzA1Nn0.56MIbpOtVu9b_fwEyo-hvlxGxA_E5c-nU7q1MSfTg-g

      - name: Add iOS & Sync Capacitor
        run: |
          cp capacitor.pro.config.ts capacitor.config.ts
          [ ! -d "ios/App" ] && pnpm exec cap add ios
          rm -rf node_modules/@capgo
          rm -rf node_modules/@capacitor/app node_modules/.pnpm/@capacitor+app*
          pnpm exec cap sync ios

          if [ ! -f "ios/App/App.xcodeproj/project.pbxproj" ]; then
            echo "ERROR: Xcode project not properly configured"
            exit 1
          fi

      - name: Build unsigned iOS IPA
        run: |
          cd ios/App
          xcodebuild -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -allowProvisioningUpdates \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            clean build

      - name: Package Payload to IPA
        run: |
          BUILD_PATH=$(find ~/Library/Developer/Xcode/DerivedData -path "*/Build/Products/Release-iphoneos/App.app" -type d 2>/dev/null | head -1)
          if [ -z "$BUILD_PATH" ]; then
            echo "ERROR: Could not find App.app in DerivedData"
            exit 1
          fi
          mkdir -p ios/App/build/Release-iphoneos/Payload
          cp -r "$BUILD_PATH" ios/App/build/Release-iphoneos/Payload/
          cd ios/App/build/Release-iphoneos
          zip -r dental-pro-unsigned.ipa Payload/

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-pro-unsigned-ipa
          path: ios/App/build/Release-iphoneos/dental-pro-unsigned.ipa
